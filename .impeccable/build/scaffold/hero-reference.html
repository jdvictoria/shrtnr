<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: dispatch-label-c.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f7e8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1672px">
  <div class="r-paper-texture region texture" data-region="paper-texture" style="background-image:url('../../../assets/plates/paper-texture.png');background-repeat:repeat"></div>
  <div class="r-topbar-rule region chrome" data-region="topbar-rule"><!-- thin black navigation baseline and vertical registration dividers --></div>
  <div class="r-brand region text" data-region="brand"><!-- small bold shrten wordmark --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-theme-control region control" data-region="theme-control"><!-- small square theme icon control: rebuild the control's chrome from the crop (comp-spec.mjs --crop theme-control); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-get-started region control" data-region="get-started"><!-- orange rectangular Get started action at top right: rebuild the control's chrome from the crop (comp-spec.mjs --crop get-started); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-headline region text" data-region="headline"><!-- large condensed black headline Pack a long URL into a link that travels --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-hero-perforation region chrome" data-region="hero-perforation"><!-- vertical dashed perforation with semicircle notches --></div>
  <div class="r-no-account region text" data-region="no-account"><!-- small monospace No account required note framed by cobalt corner marks --><p style="font-size:var(--r-no-account-font);line-height:1.05;margin:0">no-account</p></div>
  <div class="r-destination-band region chrome" data-region="destination-band"><!-- full-width ruled destination strip with black frame and cobalt registration marks --></div>
  <div class="r-destination-label region text" data-region="destination-label"><!-- small monospace Destination URL label --><p style="font-size:var(--r-destination-label-font);line-height:1.05;margin:0">destination-label</p></div>
  <div class="r-destination-input region control" data-region="destination-input"><!-- very large destination URL input containing the example URL placeholder: rebuild the control's chrome from the crop (comp-spec.mjs --crop destination-input); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-shorten-button region control" data-region="shorten-button"><!-- single orange Shorten link button with right arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop shorten-button); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-options-frame region chrome" data-region="options-frame"><!-- black outlined link-options manifest with clipped lower corners and horizontal row rules --></div>
  <div class="r-options-disclosure region control" data-region="options-disclosure"><!-- Link options disclosure row with cobalt downward chevron: rebuild the control's chrome from the crop (comp-spec.mjs --crop options-disclosure); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-custom-alias-row region control" data-region="custom-alias-row"><!-- Custom alias option row: rebuild the control's chrome from the crop (comp-spec.mjs --crop custom-alias-row); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-password-row region control" data-region="password-row"><!-- Password option row below custom alias: rebuild the control's chrome from the crop (comp-spec.mjs --crop password-row); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-expiration-row region control" data-region="expiration-row"><!-- Expiration option row: rebuild the control's chrome from the crop (comp-spec.mjs --crop expiration-row); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-geo-row region control" data-region="geo-row"><!-- Geographic redirects option row: rebuild the control's chrome from the crop (comp-spec.mjs --crop geo-row); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-center-perforation region chrome" data-region="center-perforation"><!-- vertical ticket perforation with holes and center seam --></div>
  <div class="r-result-tray region chrome" data-region="result-tray"><!-- large blank clipped-corner result handoff tray with two faint cobalt writing rules --></div>
</main>
</body>
</html>
